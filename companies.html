<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公司總覽 — AI Berkshire 投研網站</title>
<meta name="description" content="133 家公司的四維評分、投資結論與研究報告索引。">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="companies">
<header class="site-nav">
  <div class="container">
    <a class="brand" href="index.html"><span class="mark">◆</span> AI Berkshire <span>投研網站</span></a>
    <nav>
      <a href="index.html">首頁</a>
      <a href="companies.html">公司</a>
      <a href="reports.html">報告</a>
      <a href="trackrecord.html">實盤</a>
      <a href="allocation.html">配置</a>
    </nav>
    <button class="theme-toggle" aria-label="切換亮暗主題"></button>
  </div>
</header>

<main class="container" style="padding-top: 32px;">

  <div class="section-head" style="margin-bottom: 4px;">
    <h1 style="font-size:28px;">公司總覽</h1>
    <span class="more" id="co-count" style="font-size:14px; color: var(--muted);"></span>
  </div>
  <p class="section-desc">四維評分：段永平（商業模式）、巴菲特（財務估值）、芒格（行業競爭）、李錄（風險管理）。評分與結論萃取自各公司最新研究報告；點擊卡片展開報告清單。</p>

  <div class="toolbar">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input id="co-search" type="search" placeholder="搜尋公司、代碼或摘要…" aria-label="搜尋公司">
    </div>
    <div class="toolbar-row">
      <button class="chip on" data-filter="all">全部</button>
      <button class="chip" data-filter="scored">有評分</button>
      <button class="chip" data-filter="positive">✅ 正面</button>
      <button class="chip" data-filter="neutral">❓ 中性</button>
      <button class="chip" data-filter="negative">❌ 負面</button>
      <button class="chip" data-watch="1">⭐ 我的關注</button>
    </div>
    <div class="toolbar-row">
      <span class="tb-label">交易所</span>
      <button class="chip on" data-exch="all">全部</button>
      <button class="chip" data-exch="hk">港股</button>
      <button class="chip" data-exch="us">美股</button>
      <button class="chip" data-exch="cn">A股</button>
      <button class="chip" data-exch="other">其他</button>
      <span class="tb-label">最低評分</span>
      <button class="chip on" data-min="0">不限</button>
      <button class="chip" data-min="3">3★+</button>
      <button class="chip" data-min="4">4★+</button>
      <span class="tb-label">行業</span>
      <select id="co-sector" class="tb-select" aria-label="篩選行業">
        <option value="all">全部行業</option>
      </select>
      <span class="tb-label">排序</span>
      <select id="co-sort" class="tb-select" aria-label="排序方式">
        <option value="score">評分高 → 低</option>
        <option value="latest">最近更新</option>
        <option value="count">報告數多 → 少</option>
      </select>
    </div>
  </div>

  <div class="co-grid" id="co-grid"></div>

  <section class="section">
    <div class="section-head">
      <h2>📚 專題與篩選池</h2>
    </div>
    <p class="section-desc">跨公司主題研究、大師研究與全市場篩選池，點擊展開報告清單。</p>
    <div class="topic-grid" id="topic-grid"></div>
  </section>

</main>

<!-- 比較列（選好公司後出現） -->
<div class="cmp-bar" id="cmp-bar" hidden>
  <span class="cmp-hint">已選 <b id="cmp-n">0</b>/3 家公司</span>
  <span class="cmp-chips" id="cmp-chips"></span>
  <span class="cmp-spacer"></span>
  <button class="btn primary" id="cmp-go">⚖️ 開始比較</button>
  <button class="btn" id="cmp-clear">清空</button>
</div>

<!-- 比較彈窗 -->
<div class="cmp-modal" id="cmp-modal" hidden>
  <div class="cmp-panel">
    <div class="cmp-head">
      <h3>⚖️ 公司比較</h3>
      <button class="cmp-close" id="cmp-close" aria-label="關閉比較">✕</button>
    </div>
    <div class="cmp-scroll">
      <table class="data-table cmp-table" id="cmp-table"></table>
    </div>
  </div>
</div>

<footer class="site-foot">
  <div class="container">
    <div class="links">
      <a href="https://github.com/xbtlin/ai-berkshire" target="_blank" rel="noopener">GitHub：xbtlin/ai-berkshire</a>
    </div>
    <p>本網站為研究框架展示，所有內容不構成投資建議。投資有風險，決策需謹慎。</p>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
