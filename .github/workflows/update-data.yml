name: 更新数据与报告

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 更新模式（小更新＝關鍵數據約 30 秒；大更新＝全部數據＋全部報告）
        required: true
        default: "small"
        type: choice
        options:
          - small
          - big

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  # 小更新：只重抓行情/FRED/資產 1Y（並行）並重建 data.js，報告與個股頁不重渲染
  small:
    if: ${{ github.event.inputs.mode == 'small' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 部署仓库
        uses: actions/checkout@v4

      - name: 快速重建（行情 + FRED + 資產 1Y 並行抓取，重建 data.js）
        run: python3 build_site.py --repo . --quick

      - name: 提交并推送（无变更则跳过）
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "無變更，跳過提交"
            exit 0
          fi
          git config user.name "aliu29775-bot"
          git config user.email "aliu29775-bot@users.noreply.github.com"
          git add -A
          git commit -m "auto: 小更新（關鍵數據）$(date +%F)"
          git push

  # 大更新：全量抓取 + 渲染全部報告與個股頁，並寫入報告快取供小更新使用
  big:
    if: ${{ github.event.inputs.mode == 'big' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 部署仓库
        uses: actions/checkout@v4

      - name: Clone 源报告仓库（上游 + fork 叠加合并）
        run: |
          git clone --depth 1 https://github.com/xbtlin/ai-berkshire.git /tmp/ai-berkshire
          git clone --depth 1 https://github.com/aliu29775-bot/ai-berkshire.git /tmp/ai-berkshire-fork
          # fork 独有的报告文件叠加到上游（不覆盖上游同路径文件）
          rsync -a --ignore-existing /tmp/ai-berkshire-fork/reports/ /tmp/ai-berkshire/reports/
          # index.json 按 path 并集（fork 独有条目保留）
          python3 - <<'EOF'
          import json
          up = json.load(open('/tmp/ai-berkshire/reports/index.json', encoding='utf-8'))
          fk = json.load(open('/tmp/ai-berkshire-fork/reports/index.json', encoding='utf-8'))
          seen = {r['path'] for r in up['reports']}
          for r in fk['reports']:
              if r['path'] not in seen:
                  seen.add(r['path'])
                  up['reports'].append(r)
          up['count'] = len(up['reports'])
          json.dump(up, open('/tmp/ai-berkshire/reports/index.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=1)
          print('index 并集条目数:', up['count'])
          EOF

      - name: 全量重建（抓取全部數據 + 渲染全部報告與個股頁）
        run: python3 build_site.py --repo /tmp/ai-berkshire

      - name: 提交并推送（无变更则跳过）
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "無變更，跳過提交"
            exit 0
          fi
          git config user.name "aliu29775-bot"
          git config user.email "aliu29775-bot@users.noreply.github.com"
          git add -A
          git commit -m "auto: 大更新（全部數據與報告）$(date +%F)"
          git push
